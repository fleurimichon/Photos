<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twenty One Pilots 2026</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px 10px;
        }
        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            color: #ffffff;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            object-fit: cover;
        }
        /* Spécificité pour la photo paysage (IMG_4477) */
        .gallery img.landscape {
            max-height: 400px;
            object-fit: contain;
            background-color: #111;
        }
    </style>
</head>
<body>

    <h1>Twenty One Pilots 2026</h1>

    <div class="gallery">
        <img src="IMG_5669.jpg" alt="Concert TOP">
        <img src="IMG_5670.jpg" alt="Concert TOP">
        <img src="IMG_5667.jpg" alt="Concert TOP">
        <img src="IMG_5668.jpg" alt="Concert TOP">
        <img src="IMG_4485.jpeg" alt="Concert TOP">
        <img src="IMG_4498.jpeg" alt="Concert TOP">
        <img src="IMG_5666.jpg" alt="Concert TOP">
        <img src="IMG_5665.jpg" alt="Concert TOP">
        <!-- Photo paysage adaptée -->
        <img src="IMG_4477.jpeg" class="landscape" alt="Concert TOP Paysage">
        <img src="IMG_5662.jpg" alt="Concert TOP">
        <img src="IMG_5663.jpg" alt="Concert TOP">
        <img src="IMG_5664.jpg" alt="Concert TOP">
    </div>

</body>
</html>
